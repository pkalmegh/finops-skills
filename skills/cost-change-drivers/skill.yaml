id: cost-change-drivers
version: 0.1.0
capability:
- reporting-analytics
- allocation
personas:
- finops-practitioner
- finance
mode: inform-analyze-recommend
scope:
- public-cloud
expected_outcome: Identify main teams, services, or tags driving cost changes between
  time periods.
inputs:
  required:
  - name: cost_variance_report
    shape: '{ period_a: daterange, period_b: daterange, change_amount: money }'
  optional:
  - name: tagging_notes
    shape: str
  source_hint: FOCUS dataset or provider-specific metrics
  data_trust:
    require_pass:
    - freshness
    - schema
parameters:
  cadence:
    type: enum
    values:
    - daily
    - weekly
    - monthly
    default: weekly
guardrails:
  risk_level: low
  reversibility: medium
  requires_human_approval: false
  may_mutate_infrastructure: false
output:
  schema:
    summary: str
    recommendations:
    - str
    insufficient_data: bool
    assumptions:
    - str
evals:
  fixtures: ./evals/fixtures/
  rubric: ./evals/rubric.yaml
