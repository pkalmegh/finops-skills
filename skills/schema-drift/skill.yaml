id: schema-drift
version: 0.1.0
capability:
- data-ingestion
- allocation
personas:
- finops-practitioner
mode: analyze-recommend
scope:
- public-cloud
- saas
expected_outcome: Audit of schemas for column/type changes and unexpected deviations.
inputs:
  required:
  - name: dataset_schema
    shape: '{ columns: [str], types: [str] }'
  optional:
  - name: tagging_notes
    shape: str
  source_hint: FOCUS dataset or provider-specific metrics
  data_trust:
    require_pass:
    - freshness
    - schema
parameters:
  cadence:
    type: enum
    values:
    - daily
    - weekly
    - monthly
    default: weekly
guardrails:
  risk_level: low
  reversibility: medium
  requires_human_approval: false
  may_mutate_infrastructure: false
output:
  schema:
    summary: str
    recommendations:
    - str
    insufficient_data: bool
    assumptions:
    - str
